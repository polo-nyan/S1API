# Managed by depbot.py (fleet dependabot config).
# Ecosystems auto-detected from the repo tree; minor+patch grouped to curb PR spam.
# Safe to hand-edit: `update` only ADDS missing grouping, it never rewrites entries.
version: 2
updates:
- package-ecosystem: nuget
  directory: /
  schedule:
    interval: weekly
    day: wednesday
    time: "02:30"
    timezone: Europe/Berlin
  open-pull-requests-limit: 10
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
    majors:
      update-types:
      - major
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: wednesday
    time: "02:40"
    timezone: Europe/Berlin
  open-pull-requests-limit: 10
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
    majors:
      update-types:
      - major
