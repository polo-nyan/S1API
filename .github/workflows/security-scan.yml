# Caller stub → the fleet's single security-scan (gitleaks / OSV / Semgrep).
# Advisory (non-gating). See workcollection/fleet-actions (docs/TAG-PLAN.md).
name: Security Scan

on:
  push:
    branches: [stable]
    paths-ignore: ['**.md', 'docs/**', '.claude/**']
  pull_request:
    branches: [stable]
  schedule:
    - cron: '51 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: workcollection/fleet-actions/.github/workflows/security-scan.yml@v2.0.0
    with:
      runs-on: self-hosted
